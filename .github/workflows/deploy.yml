name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # PR ではシークレットを使わず、モックモードでビルドできることだけ確認する
      - run: npm run build
        env:
          ALLOW_MOCK: '1'

  # 画面の通しテスト（モックモードのビルドを Playwright で操作する）
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  deploy:
    if: github.event_name != 'pull_request'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # GAS の URL と Google ログインのクライアントID を index.html に埋め込む（どちらも秘密ではない。
      # 使える人と管理者は、GAS が ID トークンを検証して FSIF の Access Manager に問い合わせて決める）
      - name: Check settings
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
        run: |
          for name in GAS_URL GOOGLE_CLIENT_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name が設定されていません（GAS_URL は Secrets、GOOGLE_CLIENT_ID は Variables か Secrets）"; exit 1; fi
          done

      - name: Build
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
